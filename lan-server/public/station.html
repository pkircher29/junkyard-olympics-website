<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171814">
  <title>Station Check-in · Junkyard Olympics</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="mobile-page station-mobile-page" data-state="loading">
  <a class="skip" href="#main">Skip to station check-in</a>
  <header class="mobile-masthead">
    <div class="brand">Junkyard Olympics<small>Station check-in</small></div>
    <span class="live-bug" data-connection aria-live="polite"></span>
  </header>
  <main id="main" class="mobile-shell">
    <section class="signup-card dented-card station-checkin-card" aria-labelledby="station-title">
      <p class="feed-kicker">Printed station QR</p>
      <h1 id="station-title">Loading station…</h1>
      <p id="station-instruction" class="plain-instruction">Checking your competitor pass and called match.</p>
      <div id="station-match" hidden>
        <p id="station-event" class="call-event"></p>
        <div id="station-matchup" class="mobile-matchup"></div>
        <div class="countdown-row"><span>Time left to report</span><strong id="station-countdown">5:00</strong></div>
        <button id="station-check-in" class="primary-action" type="button">I'm here — check in my team</button>
      </div>
      <p id="station-status" class="form-status" role="status" aria-live="polite"></p>
      <a id="station-back" class="secondary-action" href="/participant.html">Back to my competitor pass</a>
    </section>
  </main>
  <footer class="mobile-footer">No station screen required · This page runs on your phone</footer>
  <script type="module" src="/js/station-page.js"></script>
</body>
</html>
